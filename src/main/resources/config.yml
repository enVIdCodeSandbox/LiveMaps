# LiveMaps configuration
# Maps follow BlueMap / squaremap tiles that are ALREADY rendered. LiveMaps never starts or changes BlueMap/squaremap renders.

# --------------------------------------------------------------------------------------------------
# Web app (where players pick a view and size). Players open it with /livemap web or the Live Map Designer item.
# --------------------------------------------------------------------------------------------------
web:
  enabled: true
  bind-address: "0.0.0.0"
  port: 8185
  # Public address players use to reach the web app, e.g. "https://livemaps.example.com".
  # Leave empty to use http://<server-ip>:<port> (the server-ip from server.properties, or "localhost").
  # The app uses plain HTTP; put it behind a reverse proxy for HTTPS.
  public-url: ""
  # How long a /livemap web link works before it is used (minutes), and how long a browser session lasts (minutes).
  link-minutes: 10
  session-minutes: 120
  # Max previews rendered at the same time (previews are rendered on the server).
  max-concurrent-previews: 2

# --------------------------------------------------------------------------------------------------
# Size limits. Maps are made of 128x128 pixel map items, so "width: 3, height: 2" means 6 maps.
# --------------------------------------------------------------------------------------------------
limits:
  min-width: 1
  min-height: 1
  max-width: 8
  max-height: 8
  # A warning is shown (and confirmation required) when width*height is at or above this. 0 disables.
  warn-total-maps: 12
  # How many live maps one player may own. Players with livemaps.bypass.limits are exempt.
  max-live-maps-per-player: 10

# --------------------------------------------------------------------------------------------------
# What it costs to create a live map in survival mode. Creative mode (and livemaps.bypass.cost) is free.
# --------------------------------------------------------------------------------------------------
cost:
  enabled: true
  # Item consumed (one per map tile). "MAP" is the vanilla empty map.
  material: MAP
  per-map: 1

# --------------------------------------------------------------------------------------------------
# Live updates.
# --------------------------------------------------------------------------------------------------
update:
  # Default re-render interval (seconds) for auto-updating maps that don't have a custom interval
  # set in the LiveMaps designer. 600 = 10 minutes.
  interval-seconds: 600
  # A live map is only updated while a player is within this many blocks of it, or is holding one.
  active-radius: 96
  # Worker threads used for rendering.
  render-threads: 2
  # Decoded source tiles kept in memory (each BlueMap tile is roughly 2 MB).
  tile-cache-size: 40

# --------------------------------------------------------------------------------------------------
# What happens when a map that was placed with a kit is broken.
# --------------------------------------------------------------------------------------------------
breaking:
  # INDIVIDUAL: only the hit tile pops out as an item (and keeps updating if placed again).
  # ENTIRE:     the whole connected map comes off the wall.
  mode: INDIVIDUAL
  # ENTIRE only. KIT: drop a single kit that re-places the whole map. TILES: drop every tile separately.
  entire-drop: KIT

placement:
  # Ask other plugins (WorldGuard, claims...) whether the player may interact with every frame.
  check-protection: true

# --------------------------------------------------------------------------------------------------
# Sources
# --------------------------------------------------------------------------------------------------
bluemap:
  enabled: true
  # How tiles are read: AUTO (files if found, otherwise HTTP), FILE or HTTP.
  tiles-mode: AUTO
  # FILE mode: folder containing one folder per map id. "auto" = <BlueMap web root>/maps
  # Change this only if you moved BlueMap's file storage root (bluemap/storages/file.conf).
  tiles-root: auto
  # HTTP mode (needed for SQL storage): base URL of BlueMap's web server, as reachable from this server.
  http-base-url: "http://127.0.0.1:8100"
  # Used for the "open in BlueMap" link in the web app, e.g. "https://map.example.com". Optional.
  public-url: ""

squaremap:
  enabled: true

# --------------------------------------------------------------------------------------------------
# Rendering defaults (players can change most of these in the web app).
# --------------------------------------------------------------------------------------------------
rendering:
  # Default distance 3D views can see, in blocks. Players can pick their own in the web app, up to max-view-distance.
  view-distance: 384
  # The farthest a player may ask a 3D view to see. Bigger = more tiles in memory and slower renders.
  max-view-distance: 1536
  # Automatic detail for 3D views: BlueMap keeps several resolution levels (e.g. 1, 5 and 25 blocks per cell) and a view
  # uses the finest level close to the camera and coarser levels further out. 1.0 matches one cell to about one map pixel;
  # 2.0 keeps the finer levels about twice as far out (sharper horizon, slower). Players can also set the "sharp distance" themselves.
  detail-bias: 1.0
  # Max tiles loaded for a single render, all detail levels together (protects memory; each BlueMap tile is about 2 MB).
  max-tiles-per-render: 64
  # Colour for unrendered/empty areas, hex.
  void-color: "#14141E"
  # Overrides the sky colour read from BlueMap. Empty = use BlueMap's sky colour.
  sky-color: ""
  defaults:
    # Relief shading for top-down views, 0..1.
    shading: 0.6
    # NONE, ORDERED, FLOYD_STEINBERG. Floyd-Steinberg looks best; ORDERED is steadier when tiles change a little.
    dither: FLOYD_STEINBERG
    # How to enlarge when zoomed in beyond 1 block per pixel: NEAREST (crisp blocks) or BILINEAR.
    upscale: NEAREST
    # Anti-aliasing for 3D views (1-3 samples per axis). Higher is nicer and slower.
    supersample: 2
    shadows: false
    fog: 0.25

# --------------------------------------------------------------------------------------------------
# Crafting. The Live Map Designer opens the web app when right-clicked.
# --------------------------------------------------------------------------------------------------
crafting:
  enabled: true
  recipe:
    shape:
      - " M "
      - "RCR"
      - " M "
    ingredients:
      M: MAP
      R: REDSTONE
      C: COMPASS
